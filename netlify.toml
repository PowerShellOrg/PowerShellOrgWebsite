[build]
  base = "/"
  command = "hugo --minify"
  publish = "public"

[[redirects]]
  from = "/summit/"
  to = "https://powershellsummit.org/"
  status = 301
  force = true


[build.environment]
  HUGO_VERSION = "0.155.1"
  HUGO_ENVIRONMENT = "production"
  TZ = "UTC"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/discord/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
                    <a href="{{ .Site.Params.summit.registration_url }}"
[themes/powershell-community/layouts/partials/footer.html#B4A2]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are fingerprinted by Hugo (content hash in filename) — safe to cache forever.
[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
                    <li><a href="{{ .Site.Params.summit.registration_url }}" class="text-gray-400 hover:text-white transition-colors duration-200">Summit</a></li>
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted — cache for 30 days without immutable so updates propagate.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
